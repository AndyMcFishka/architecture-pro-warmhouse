events {}
http {
  resolver 127.0.0.11 valid=1s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 64k;
    location = /health { return 200 '{"status":"ok"}'; }
    location /api/v1/telemetry/ { set $backend telemetry; proxy_pass http://$backend:8080$request_uri; }
    location /api/v1/heating/ { set $backend heating; proxy_pass http://$backend:8080$request_uri; }
    location /api/v1/lighting/ { set $backend lighting; proxy_pass http://$backend:8080$request_uri; }
    location /api/v1/gates/ { set $backend gates; proxy_pass http://$backend:8080$request_uri; }
    location /api/v1/video/ { set $backend video; proxy_pass http://$backend:8080$request_uri; }
    location /api/v1/scenarios/ { set $backend scenarios; proxy_pass http://$backend:8080$request_uri; }
    location /api/v1/ { set $backend app; proxy_pass http://$backend:8080$request_uri; }
    location / { return 404; }
  }
}
